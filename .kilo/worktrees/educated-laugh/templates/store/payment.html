{% extends 'base.html' %}{% block title %}Secure payment — SEEKUPERFUMES{% endblock %}{% block content %}<section class="success-page"><p class="eyebrow">Secure payment</p><h1>Complete your order.</h1><p>Order {{ order.number }} · ₹{{ order.total|floatformat:0 }}</p><button id="pay-now" class="button">Pay with Razorpay</button><p id="payment-status" aria-live="polite"></p></section>{% endblock %}{% block scripts %}<script src="https://checkout.razorpay.com/v1/checkout.js"></script><script>document.getElementById('pay-now').addEventListener('click',function(){const status=document.getElementById('payment-status');new Razorpay({key:'{{ razorpay_key|escapejs }}',amount:Math.round(Number('{{ order.total }}')*100),currency:'INR',name:'SEEKUPERFUMES',description:'Order {{ order.number|escapejs }}',order_id:'{{ order.payment.provider_order_id|escapejs }}',prefill:{name:'{{ order.full_name|escapejs }}',email:'{{ order.email|escapejs }}',contact:'{{ order.phone|escapejs }}'},theme:{color:'#6A4A3C'},handler:async function(r){status.textContent='Verifying payment…';const response=await fetch('{% url "payment_verify" %}',{method:'POST',headers:{'Content-Type':'application/json','X-CSRFToken':document.body.dataset.csrf},body:JSON.stringify({...r,order_number:'{{ order.number|escapejs }}'})});const data=await response.json();if(response.ok)location.href=data.redirect;else status.textContent=data.error;}}).open()});</script>{% endblock %}
